# Вехи страницы прогресса (Д38): качественные события с доказательствами.
#
# Веха — не измерение: на странице она подписана, а не выдаётся за число.
# Каждая — с источником (вид, где, ссылка, дата, способ проверки — как у
# фактов, CLAIM_POLICY §6); fact — id в data/facts/facts.yaml, если веха
# повторяет факт. Тексты — публичные: без кода, путей, имён веток и
# внутреннего (Д17, граница — data/progress/scope.yaml). На странице вместо
# источника — его вид («история git», «журнал решений проекта», …).
#
# kind: decision (решение автора) | verification | device | release (проверено,
#       выпущено, замерено) | start | build | world | graphics | process |
#       platform | repository | publishing | structure (работа и новые системы)
schema: progress_milestones/v1
milestones:
