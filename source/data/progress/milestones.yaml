    date: 2026-09-11
    kind: start
    repos: [galdhold]
    fact: GH-REPO-START
    ru: Первый коммит Galdhold (прежде VoxelRPG) — 234 файла и 30 801 строка, написанные до репозитория.
    en: The first commit of Galdhold (formerly VoxelRPG) — 234 files and 30,801 lines written before the repository existed.
    evidence:
      - {kind: code, source: "dpsmpx/Galdhold — первый коммит", ref: 758804f, date: 2026-09-11, verification: re-measured}
