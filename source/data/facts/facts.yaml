# Реестр утверждений (Content Facts / Claims / Evidence).
#
# Единственный источник фактов для контента (Д1, Д6). Контент ссылается
# на факты по id; утверждение без записи здесь — неподтверждённое.
# Правила — docs/content/CLAIM_POLICY.md; схема — schemas/facts.schema.json.
#
# class:        FACT | INTERPRETATION | HYPOTHESIS
# risk:         high (числа, «собственный», «работает на», сроки, сравнения) | medium | low
# public:       можно ли использовать в публичном контенте
# verification: re-measured (перемерено в сессии) | reported (из документа
#               проекта, не перепроверено) | observed (видно на площадке) |
#               decision (записанное решение) | self-reported (сказано автором)
# recheck_by:   дата, после которой число/состояние перепроверяется перед использованием
schema: facts/v1
as_of: 2026-10-12
# Выведенные из реестра id: ссылки на них в документах — история; в контент
# они не подставляются (подстановка их не знает).
retired:
  - {id: AU-NAME, date: 2026-10-05, reason: "Д40: имени автора нет нигде — факт удалён вместе с именем"}
